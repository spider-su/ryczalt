name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'assets/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'vitest.config.mts'
      - '.gitignore'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'assets/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'vitest.config.mts'
      - '.gitignore'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run ci
      - run: npx expo-doctor
      - run: npx expo export --platform web
      - run: npx expo prebuild --no-install --platform android
