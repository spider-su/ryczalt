name: Mobile Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify EAS credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=CI configuration missing::EXPO_TOKEN is required for the automatic EAS production build. Add it as a repository secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production apps
        run: eas build --platform all --profile production --non-interactive
