name: Live Accounting API

on:
  workflow_dispatch:
    inputs:
      month:
        description: Accounting month (YYYY-MM; blank uses current UTC month)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://investory-61359240267.europe-central2.run.app
      PROFILE_ID: '1'
      TEST_USER: ${{ secrets.INVESTORY_TEST_USER }}
      TEST_PASSWORD: ${{ secrets.INVESTORY_TEST_PASSWORD }}
      REQUESTED_MONTH: ${{ inputs.month }}
    steps:
      - name: Preflight live API credentials
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="$RUNNER_TEMP/investory-live-api"
          mkdir -p "$ARTIFACT_DIR"
          PREFLIGHT_FILE="$ARTIFACT_DIR/credential-preflight.txt"
          MISSING_CREDENTIAL=0

          if [[ -z "$TEST_USER" ]]; then
            echo "::error::Missing repository secret INVESTORY_TEST_USER"
            printf '%s\n' 'FAIL: INVESTORY_TEST_USER missing' > "$PREFLIGHT_FILE"
            MISSING_CREDENTIAL=1
          else
            echo "::add-mask::$TEST_USER"
          fi
          if [[ -z "$TEST_PASSWORD" ]]; then
            echo "::error::Missing repository secret INVESTORY_TEST_PASSWORD"
            if [[ "$MISSING_CREDENTIAL" -eq 1 ]]; then
              printf '%s\n' 'FAIL: INVESTORY_TEST_PASSWORD missing' >> "$PREFLIGHT_FILE"
            else
              printf '%s\n' 'FAIL: INVESTORY_TEST_PASSWORD missing' > "$PREFLIGHT_FILE"
            fi
            MISSING_CREDENTIAL=1
          else
            echo "::add-mask::$TEST_PASSWORD"
          fi

          if [[ "$MISSING_CREDENTIAL" -ne 0 ]]; then
            exit 1
          fi

      - name: Run live accounting API smoke
        id: smoke
        shell: bash
        run: |
          set -uo pipefail

          ARTIFACT_DIR="$RUNNER_TEMP/investory-live-api"
          mkdir -p "$ARTIFACT_DIR"
          PASS=0
          WARN=0
          FAIL=0
          MONTH="${REQUESTED_MONTH:-}"
          if [[ -z "$MONTH" ]]; then
            MONTH="$(date -u +%Y-%m)"
          fi

          fail_check() {
            FAIL=$((FAIL + 1))
            echo "FAIL: $1"
          }

          pass_check() {
            PASS=$((PASS + 1))
            echo "PASS: $1"
          }

          warn_check() {
            WARN=$((WARN + 1))
            echo "WARN: $1"
          }

          request() {
            local name="$1"
            local method="$2"
            local path="$3"
            local auth="${4:-yes}"
            local body="$ARTIFACT_DIR/${name}.body"
            local status_file="$ARTIFACT_DIR/${name}.status"
            local rc_file="$ARTIFACT_DIR/${name}.rc"
            local stderr_file="$ARTIFACT_DIR/${name}.stderr"
            local status
            local rc
            local -a args=(
              --silent
              --show-error
              --location
              --connect-timeout 10
              --max-time 180
              --request "$method"
              --header "Accept: application/json"
              --output "$body"
              --write-out '%{http_code}'
            )

            if [[ "$auth" == "yes" ]]; then
              args+=(--user "$TEST_USER:$TEST_PASSWORD")
            fi

            if status="$(curl "${args[@]}" "${BASE_URL}${path}" 2>"$stderr_file")"; then
              rc=0
            else
              rc=$?
            fi
            printf '%s\n' "$status" > "$status_file"
            printf '%s\n' "$rc" > "$rc_file"
          }

          safe_body_summary() {
            local name="$1"
            local status="$2"
            local semantic_error="${3:-}"
            local body="$ARTIFACT_DIR/${name}.body"
            local summary="$ARTIFACT_DIR/${name}.body.safe"

            if [[ -s "$body" ]] && jq -e . "$body" >/dev/null 2>&1; then
              if [[ "$status" == 2?? ]]; then
                jq -c '
                  if type == "array" then
                    {type: "array", length: length, firstItemKeys: (if (length > 0) and ((.[0] | type) == "object") then (.[0] | keys | sort) else [] end)}
                  elif type == "object" then
                    {type: "object", keys: (keys | sort)}
                  else
                    {type: type}
                  end
                ' "$body" > "$summary"
              elif [[ -n "$semantic_error" ]]; then
                jq -cn --arg error "$semantic_error" '{error: $error}' > "$summary"
              else
                jq -c '{status: .status, path: .path, error: .error} | with_entries(select(.value != null))' "$body" > "$summary"
              fi
              mv "$summary" "$body"
            else
              printf '%s\n' '{"response":"empty-or-non-json"}' > "$body"
            fi
          }

          request openapi GET /v3/api-docs yes
          request openapi-unauthenticated GET /v3/api-docs no

            OPENAPI_STATUS="$(cat "$ARTIFACT_DIR/openapi.status")"
            OPENAPI_RC="$(cat "$ARTIFACT_DIR/openapi.rc")"
            OPENAPI_VALID=false
            if [[ "$OPENAPI_RC" == "0" && "$OPENAPI_STATUS" == "200" ]] && jq -e '.paths | type == "object"' "$ARTIFACT_DIR/openapi.body" >/dev/null 2>&1; then
              cp "$ARTIFACT_DIR/openapi.body" "$ARTIFACT_DIR/openapi.json"
              OPENAPI_VALID=true
              pass_check "OpenAPI authenticated: HTTP $OPENAPI_STATUS"
            else
              fail_check "OpenAPI authenticated: curl rc=$OPENAPI_RC HTTP=$OPENAPI_STATUS or invalid paths schema"
            fi

            OPENAPI_UNAUTH_STATUS="$(cat "$ARTIFACT_DIR/openapi-unauthenticated.status")"
            OPENAPI_UNAUTH_RC="$(cat "$ARTIFACT_DIR/openapi-unauthenticated.rc")"
            if [[ "$OPENAPI_UNAUTH_RC" == "0" && "$OPENAPI_UNAUTH_STATUS" == "200" ]]; then
              warn_check 'OpenAPI unauthenticated: HTTP 200 (public OpenAPI allowed)'
            elif [[ "$OPENAPI_UNAUTH_RC" == "0" ]]; then
              warn_check "OpenAPI unauthenticated: HTTP $OPENAPI_UNAUTH_STATUS"
            else
              warn_check "OpenAPI unauthenticated: curl rc=$OPENAPI_UNAUTH_RC HTTP=$OPENAPI_UNAUTH_STATUS"
            fi

          if [[ "$OPENAPI_VALID" == true ]]; then
            jq -r '
              .paths
              | to_entries[]
              | select(.key | ascii_downcase | contains("accounting"))
              | .key as $path
              | .value
              | to_entries[]
              | select(.key | IN("get", "post", "put", "patch", "delete"))
              | "\(.key | ascii_upcase) \($path)"
            ' "$ARTIFACT_DIR/openapi.json" | sort -u > "$ARTIFACT_DIR/accounting-operations.txt"
            jq -r '.paths | keys[] | select((ascii_downcase | contains("payment")) or (ascii_downcase | contains("settlement")))' "$ARTIFACT_DIR/openapi.json" | sort -u > "$ARTIFACT_DIR/payment-route-candidates.txt"
            jq -r '.paths | keys[] | select((ascii_downcase | contains("document")) or (ascii_downcase | contains("recognize")) or (ascii_downcase | contains("counterpart")))' "$ARTIFACT_DIR/openapi.json" | sort -u > "$ARTIFACT_DIR/document-route-candidates.txt"
            pass_check 'Accounting OpenAPI discovery'
          else
            : > "$ARTIFACT_DIR/accounting-operations.txt"
            : > "$ARTIFACT_DIR/payment-route-candidates.txt"
            : > "$ARTIFACT_DIR/document-route-candidates.txt"
            fail_check 'Accounting OpenAPI discovery unavailable'
          fi

            request accounting-period GET "/api/profiles/$PROFILE_ID/accounting/periods/$MONTH" yes
            MONTH_STATUS="$(cat "$ARTIFACT_DIR/accounting-period.status")"
            MONTH_RC="$(cat "$ARTIFACT_DIR/accounting-period.rc")"
            if [[ "$MONTH_RC" == "0" && "$MONTH_STATUS" == "200" ]]; then
              MONTH_RESULT='PASS'
            elif [[ "$MONTH_RC" == "28" ]]; then
              MONTH_RESULT='FAIL (ACCOUNTING_PERIOD_TIMEOUT)'
            elif [[ "$MONTH_RC" != "0" ]]; then
              MONTH_RESULT="FAIL (TRANSPORT_ERROR rc=$MONTH_RC)"
            elif [[ "$MONTH_STATUS" != "200" ]]; then
              MONTH_RESULT="FAIL (HTTP_$MONTH_STATUS)"
            fi
            [[ "$MONTH_RESULT" == PASS ]] && pass_check 'Accounting month: PASS' || fail_check "Accounting month: $MONTH_RESULT"

            request invoices GET "/api/profiles/$PROFILE_ID/accounting/periods/$MONTH/invoices" yes
            INVOICES_STATUS="$(cat "$ARTIFACT_DIR/invoices.status")"
            INVOICES_RC="$(cat "$ARTIFACT_DIR/invoices.rc")"
            if [[ "$INVOICES_RC" == "0" && "$INVOICES_STATUS" == "200" ]]; then
              INVOICES_RESULT='PASS'
            elif [[ "$INVOICES_RC" != "0" ]]; then
              INVOICES_RESULT="FAIL (TRANSPORT_ERROR rc=$INVOICES_RC)"
            else
              INVOICES_RESULT="FAIL (HTTP_$INVOICES_STATUS)"
            fi
            [[ "$INVOICES_RESULT" == PASS ]] && pass_check 'Invoices: PASS' || fail_check "Invoices: $INVOICES_RESULT"
            safe_body_summary invoices "$INVOICES_STATUS"

            request payment-history GET "/api/profiles/$PROFILE_ID/accounting/payments?from=$MONTH&to=$MONTH" yes
            PAYMENT_STATUS="$(cat "$ARTIFACT_DIR/payment-history.status")"
            PAYMENT_RC="$(cat "$ARTIFACT_DIR/payment-history.rc")"
            if [[ "$PAYMENT_RC" == "0" && "$PAYMENT_STATUS" == "200" ]]; then
              PAYMENT_RESULT='PASS'
            elif [[ "$PAYMENT_RC" != "0" ]]; then
              PAYMENT_RESULT="FAIL (TRANSPORT_ERROR rc=$PAYMENT_RC)"
            elif [[ "$PAYMENT_STATUS" == "404" ]]; then
              PAYMENT_RESULT='FAIL (PAYMENT_HISTORY_ROUTE_MISMATCH)'
            else
              PAYMENT_RESULT="FAIL (HTTP_$PAYMENT_STATUS)"
            fi
            [[ "$PAYMENT_RESULT" == PASS ]] && pass_check 'Payment history: PASS' || fail_check "Payment history: $PAYMENT_RESULT"
            if [[ "$PAYMENT_RC" == "0" && "$PAYMENT_STATUS" == "404" ]]; then
              safe_body_summary payment-history "$PAYMENT_STATUS" PAYMENT_HISTORY_ROUTE_MISMATCH
            else
              safe_body_summary payment-history "$PAYMENT_STATUS"
            fi

          safe_body_summary openapi-unauthenticated "$(cat "$ARTIFACT_DIR/openapi-unauthenticated.status")"
          printf '%s\n' '{"response":"saved-as-openapi.json"}' > "$ARTIFACT_DIR/openapi.body"

          OPENAPI_STATUS="${OPENAPI_STATUS:-000}"
          OPENAPI_UNAUTH_STATUS="${OPENAPI_UNAUTH_STATUS:-000}"
          MONTH_STATUS="${MONTH_STATUS:-000}"
          MONTH_RC="${MONTH_RC:-not-run}"
          DOCUMENTS_STATUS="${DOCUMENTS_STATUS:-000}"
          PAYMENT_STATUS="${PAYMENT_STATUS:-000}"

          {
            echo '# Live Accounting API Smoke'
            echo
            echo "- Base URL: $BASE_URL"
            echo "- Profile: $PROFILE_ID"
            echo "- Month: $MONTH"
            echo
            echo "- OpenAPI authenticated HTTP: $OPENAPI_STATUS"
            echo "- OpenAPI unauthenticated HTTP: $OPENAPI_UNAUTH_STATUS"
            echo
            echo '| Check | HTTP | curl | Result |'
            echo '| --- | ---: | ---: | --- |'
            if [[ "$MONTH_RC" == "0" && "$MONTH_STATUS" == "200" ]]; then MONTH_RESULT='PASS'; elif [[ "$MONTH_RC" == "28" ]]; then MONTH_RESULT='FAIL (ACCOUNTING_MONTH_TIMEOUT)'; elif [[ "$MONTH_RC" != "0" ]]; then MONTH_RESULT="FAIL (TRANSPORT_ERROR rc=$MONTH_RC)"; else MONTH_RESULT="FAIL (HTTP_$MONTH_STATUS)"; fi
            if [[ "${DOCUMENTS_RC:-not-run}" == "0" && "$DOCUMENTS_STATUS" == "200" ]]; then DOCUMENTS_RESULT='PASS'; elif [[ "${DOCUMENTS_RC:-not-run}" != "0" ]]; then DOCUMENTS_RESULT="FAIL (TRANSPORT_ERROR rc=${DOCUMENTS_RC:-not-run})"; else DOCUMENTS_RESULT="FAIL (HTTP_$DOCUMENTS_STATUS)"; fi
            if [[ "${PAYMENT_RC:-not-run}" == "0" && "$PAYMENT_STATUS" == "200" ]]; then PAYMENT_RESULT='PASS'; elif [[ "${PAYMENT_RC:-not-run}" != "0" ]]; then PAYMENT_RESULT="FAIL (TRANSPORT_ERROR rc=${PAYMENT_RC:-not-run})"; elif [[ "$PAYMENT_STATUS" == "404" ]]; then PAYMENT_RESULT='FAIL (PAYMENT_HISTORY_ROUTE_MISMATCH)'; else PAYMENT_RESULT="FAIL (HTTP_$PAYMENT_STATUS)"; fi
            echo "| Accounting month | $MONTH_STATUS | $MONTH_RC | $MONTH_RESULT |"
            echo "| Documents | $DOCUMENTS_STATUS | ${DOCUMENTS_RC:-not-run} | $DOCUMENTS_RESULT |"
            echo "| Payment history | $PAYMENT_STATUS | ${PAYMENT_RC:-not-run} | $PAYMENT_RESULT |"
            echo
            echo "Overall failure count: $FAIL"
            echo
            echo '## Payment/settlement route candidates'
            sed 's/^/- `&`/' "$ARTIFACT_DIR/payment-route-candidates.txt" || true
            echo
            echo '## Document/recognition route candidates'
            sed 's/^/- `&`/' "$ARTIFACT_DIR/document-route-candidates.txt" || true
          } | tee "$ARTIFACT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FAIL" -gt 0 ]]; then
            exit 1
          fi

      - name: Upload live API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-accounting-api-${{ github.run_id }}
          path: ${{ runner.temp }}/investory-live-api
          retention-days: 7
          if-no-files-found: error
