name: Store asset validation
on:
  pull_request:
    paths: ['store-assets/**', 'scripts/store_assets.py', '.github/workflows/store-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/store_assets.py validate
