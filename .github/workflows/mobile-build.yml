name: Local Android APK

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'assets/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - name: Align Expo CLI with Expo Doctor
        run: npm install --no-save --package-lock=false '@expo/cli@^57.0.29'
      - run: npm run ci
      - run: npx expo-doctor
      - name: Generate Android project locally
        run: npx expo prebuild --clean --platform android
      - name: Assemble installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryczalt-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
